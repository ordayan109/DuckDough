name: Android APK
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Prepare Android SDK
        run: '"$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platform-tools" "platforms;android-35" "build-tools;35.0.0"'
      - uses: gradle/actions/setup-gradle@v4
      - name: Verify, test and build
        run: |
          chmod +x gradlew
          ./gradlew testDebugUnitTest lintDebug assembleDebug assembleDebugAndroidTest --stacktrace
          mkdir -p outputs/debug
          cp app/build/outputs/apk/debug/app-debug.apk outputs/debug/DuckDough-debug.apk
      - name: Build with the permanent signing key
        id: release
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          DUCKDOUGH_SIGNING_BUNDLE: ${{ secrets.DUCKDOUGH_SIGNING_BUNDLE }}
        run: |
          if [ -z "$DUCKDOUGH_SIGNING_BUNDLE" ]; then
            echo "::notice::Permanent release signing awaits the DUCKDOUGH_SIGNING_BUNDLE repository secret."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            python3 tools/build_release.py
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: DuckDough-Debug-APK
          path: outputs/debug/
          if-no-files-found: error
          retention-days: 30
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Test the app on Android
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: |
            adb shell wm size 720x1600
            adb shell wm density 320
            ./gradlew connectedDebugAndroidTest --stacktrace
            adb install -r outputs/debug/DuckDough-debug.apk
            adb shell am start -W -n com.norman.duckdough/.MainActivity
            adb shell uiautomator dump /sdcard/duckdough-window.xml
            adb exec-out screencap -p > outputs/duckdough-android.png
            python3 -c "from pathlib import Path; assert Path('outputs/duckdough-android.png').read_bytes().startswith(bytes.fromhex('89504e470d0a1a0a'))"
            if [ -f outputs/release/RELEASE.json ]; then python3 tools/verify_update.py; fi
      - name: Upload the signed and update-tested release
        if: steps.release.outputs.ready == 'true' && success()
        uses: actions/upload-artifact@v4
        with:
          name: DuckDough-Signed-Release
          path: outputs/release/
          if-no-files-found: error
          retention-days: 90
      - name: Upload test reports and Android screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: DuckDough-Test-Reports
          path: |
            app/build/reports/
            outputs/duckdough-android.png
            outputs/update-check-ui.xml
            outputs/update-check-ui.png
          if-no-files-found: warn
