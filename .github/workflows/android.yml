name: Android APK
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Prepare Android SDK
        run: '"$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platform-tools" "platforms;android-35" "build-tools;35.0.0"'
      - uses: gradle/actions/setup-gradle@v4
      - name: Verify, test and build
        run: |
          chmod +x gradlew
          ./gradlew testDebugUnitTest lintDebug assembleDebug --stacktrace
          mkdir -p outputs
          cp app/build/outputs/apk/debug/app-debug.apk outputs/DuckDough-v0.1.0.apk
          sha256sum outputs/DuckDough-v0.1.0.apk > outputs/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: DuckDough-Android-APK
          path: outputs/
          if-no-files-found: error
          retention-days: 30
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Test the app on Android
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: |
            ./gradlew connectedDebugAndroidTest --stacktrace
            adb exec-out run-as com.norman.duckdough cat files/duckdough-screen.png > outputs/duckdough-android.png
      - name: Upload test reports and Android screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: DuckDough-Test-Reports
          path: |
            app/build/reports/
            outputs/duckdough-android.png
          if-no-files-found: warn

